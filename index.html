<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Weather dashboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e8;
    --track: #eceef1;
    --text-primary: #16181d;
    --text-secondary: #6b7280;
    --text-muted: #9aa0aa;
    --accent: #2a78d6;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text-primary);
  }
  .dashboard {
    max-width: 780px;
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header days"
      "graph  days";
    gap: 10px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
  }
  .header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header .icon { font-size: 34px; line-height: 1; flex-shrink: 0; }
  .header .place-info { flex: 1; min-width: 0; }
  .header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  .header .sub { margin: 2px 0 0; font-size: 12px; color: var(--text-secondary); }
  .header .time { font-size: 12px; color: var(--text-secondary); }
  .header .temp-block { text-align: right; flex-shrink: 0; }
  .header .temp { font-size: 28px; font-weight: 600; line-height: 1; }
  .header .cond { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

  .graph { grid-area: graph; }
  .graph h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
  .graph-wrap { position: relative; width: 100%; height: 180px; }

  .days {
    grid-area: days;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .day-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
  }
  .day-row .name { font-size: 13px; font-weight: 600; width: 34px; flex-shrink: 0; }
  .day-row .icon { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }

  /* range bar widget: ( ||||| ) style, scaled to the shared week min/max */
  .range-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .range-bar .lo, .range-bar .hi {
    font-size: 12px;
    color: var(--text-secondary);
    width: 30px;
    flex-shrink: 0;
  }
  .range-bar .lo { text-align: right; }
  .range-bar .track {
    position: relative;
    flex: 1;
    height: 14px;
    background: var(--track);
    border-radius: 3px;
    overflow: hidden;
  }
  .range-bar .fill {
    position: absolute;
    top: 2px;
    bottom: 2px;
    background: var(--accent);
    border-radius: 2px;
  }

  @media (max-width: 700px) {
    .dashboard {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "header"
        "graph"
        "days";
    }
  }
</style>
</head>
<body>

<div class="dashboard">

  <div class="card header">
    <div class="icon">&hellip;</div>
    <div class="place-info">
      <h1>Loading&hellip;</h1>
      <p class="sub"><span class="time"></span></p>
    </div>
    <div class="temp-block">
      <div class="temp">&ndash;&deg;C</div>
      <div class="cond"></div>
    </div>
  </div>

  <div class="card graph">
    <h3>Next 24 hours</h3>
    <div class="graph-wrap">
      <canvas id="tempChart" role="img" aria-label="Chart of temperature and chance of rain for the next 24 hours, updated live from Open-Meteo">Loading live temperature and rain-chance data for the next 24 hours.</canvas>
    </div>
  </div>

  <div class="card days" id="days">
    <!-- rows injected by script, built from each day's low/high scaled to the shared week min/max -->
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // --- location: defaults, overridable via URL params ---
  // Examples:
  //   ?lat=48.8566&lon=2.3522&name=Paris,%20France
  //   ?city=Tokyo
  const DEFAULT_LAT = 52.2297;
  const DEFAULT_LON = 21.0122;
  const DEFAULT_LOCATION_NAME = 'Warsaw, Poland';

  const urlParams = new URLSearchParams(window.location.search);

  // WMO weather codes -> [emoji, text]. https://open-meteo.com/en/docs
  const WEATHER_CODES = {
    0: ['\u2600\ufe0f', 'Clear'], 1: ['\ud83c\udf24\ufe0f', 'Mostly clear'],
    2: ['\u26c5', 'Partly cloudy'], 3: ['\u2601\ufe0f', 'Overcast'],
    45: ['\ud83c\udf2b\ufe0f', 'Fog'], 48: ['\ud83c\udf2b\ufe0f', 'Fog'],
    51: ['\ud83c\udf27\ufe0f', 'Light drizzle'], 53: ['\ud83c\udf27\ufe0f', 'Drizzle'], 55: ['\ud83c\udf27\ufe0f', 'Dense drizzle'],
    61: ['\ud83c\udf27\ufe0f', 'Light rain'], 63: ['\ud83c\udf27\ufe0f', 'Rain'], 65: ['\ud83c\udf27\ufe0f', 'Heavy rain'],
    71: ['\ud83c\udf28\ufe0f', 'Light snow'], 73: ['\ud83c\udf28\ufe0f', 'Snow'], 75: ['\ud83c\udf28\ufe0f', 'Heavy snow'],
    80: ['\ud83c\udf26\ufe0f', 'Showers'], 81: ['\ud83c\udf26\ufe0f', 'Showers'], 82: ['\u26c8\ufe0f', 'Violent showers'],
    95: ['\u26c8\ufe0f', 'Thunderstorm'], 96: ['\u26c8\ufe0f', 'Thunderstorm'], 99: ['\u26c8\ufe0f', 'Thunderstorm']
  };
  const NIGHT_CLEAR_ICON = '\ud83c\udf19';

  function iconFor(code, isDay) {
    const entry = WEATHER_CODES[code] || ['\u2601\ufe0f', ''];
    if ((code === 0 || code === 1) && isDay === 0) return NIGHT_CLEAR_ICON;
    return entry[0];
  }
  function textFor(code) {
    return (WEATHER_CODES[code] || ['', 'Unknown'])[1];
  }

  // Resolve the location to use, then kick off the forecast fetch.
  resolveLocation()
    .then(loadForecast)
    .then(renderDashboard)
    .catch(err => {
      console.error(err);
      document.querySelector('.dashboard').insertAdjacentHTML(
        'afterbegin',
        '<p style="grid-column: 1 / -1; color: var(--text-secondary); font-size: 13px;">Couldn\u2019t load live weather data. Check your connection, or the ?city= / ?lat=&lon= value in the URL, and reload.</p>'
      );
    });

  // Returns { lat, lon, name }, from URL params if present, else the defaults.
  function resolveLocation() {
    const latParam = urlParams.get('lat');
    const lonParam = urlParams.get('lon');
    const nameParam = urlParams.get('name');
    const cityParam = urlParams.get('city');

    if (latParam && lonParam) {
      return Promise.resolve({
        lat: parseFloat(latParam),
        lon: parseFloat(lonParam),
        name: nameParam || `${latParam}, ${lonParam}`
      });
    }

    if (cityParam) {
      const geoParams = new URLSearchParams({ name: cityParam, count: '1', language: 'en', format: 'json' });
      return fetch(`https://geocoding-api.open-meteo.com/v1/search?${geoParams}`)
        .then(res => res.json())
        .then(geo => {
          const hit = geo.results && geo.results[0];
          if (!hit) throw new Error(`No location found for "${cityParam}"`);
          const label = [hit.name, hit.admin1, hit.country].filter(Boolean).join(', ');
          return { lat: hit.latitude, lon: hit.longitude, name: label };
        });
    }

    return Promise.resolve({ lat: DEFAULT_LAT, lon: DEFAULT_LON, name: DEFAULT_LOCATION_NAME });
  }

  function loadForecast(location) {
    const params = new URLSearchParams({
      latitude: location.lat,
      longitude: location.lon,
      current: 'temperature_2m,weather_code,is_day',
      hourly: 'temperature_2m,precipitation_probability',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min',
      timezone: 'auto',
      forecast_days: '6'
    });

    return fetch(`https://api.open-meteo.com/v1/forecast?${params}`)
      .then(res => {
        if (!res.ok) throw new Error('Open-Meteo request failed: ' + res.status);
        return res.json();
      })
      .then(data => {
        data._locationName = location.name;
        return data;
      });
  }

  function renderDashboard(data) {
    renderHeader(data);
    renderHourlyChart(data);
    renderDays(data);
  }

  function renderHeader(data) {
    const cur = data.current;
    document.querySelector('.header .icon').textContent = iconFor(cur.weather_code, cur.is_day);
    document.querySelector('.header h1').textContent = data._locationName;
    document.querySelector('.temp-block .temp').textContent = Math.round(cur.temperature_2m) + '\u00b0C';
    document.querySelector('.temp-block .cond').textContent = textFor(cur.weather_code);

    const now = new Date(cur.time);
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    document.querySelector('.header .sub').innerHTML = `${dateStr} &middot; <span class="time">${timeStr}</span>`;
  }

  function renderHourlyChart(data) {
    const times = data.hourly.time;
    const temps = data.hourly.temperature_2m;
    const rain = data.hourly.precipitation_probability;

    // find the index matching the current hour, then take the next 24 hours from there
    const nowMs = new Date(data.current.time).getTime();
    let startIdx = times.findIndex(t => new Date(t).getTime() >= nowMs);
    if (startIdx === -1) startIdx = 0;

    const hourLabels = [];
    const hourTemps = [];
    const hourRain = [];
    for (let i = startIdx; i < startIdx + 24 && i < times.length; i += 3) {
      const d = new Date(times[i]);
      hourLabels.push(i === startIdx ? 'Now' : d.toLocaleTimeString(undefined, { hour: 'numeric' }));
      hourTemps.push(Math.round(temps[i]));
      hourRain.push(Math.round(rain[i]));
    }

    new Chart(document.getElementById('tempChart'), {
      data: {
        labels: hourLabels,
        datasets: [
          {
            type: 'bar',
            label: 'Chance of rain (%)',
            data: hourRain,
            backgroundColor: '#a9c7ea',
            borderRadius: 3,
            yAxisID: 'y1',
            order: 2
          },
          {
            type: 'line',
            label: 'Temperature (\u00b0C)',
            data: hourTemps,
            borderColor: '#e0a800',
            backgroundColor: 'rgba(224, 168, 0, 0.12)',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: '#e0a800',
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            fill: true,
            tension: 0.35,
            yAxisID: 'y',
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          y: {
            position: 'left',
            ticks: { callback: (v) => v + '\u00b0' },
            grid: { color: '#eceef1' }
          },
          y1: {
            position: 'right',
            min: 0,
            max: 100,
            ticks: { callback: (v) => v + '%' },
            grid: { display: false }
          },
          x: {
            grid: { display: false }
          }
        }
      }
    });
  }

  function renderDays(data) {
    const daily = data.daily;
    const days = daily.time.slice(0, 5).map((dateStr, i) => ({
      name: new Date(dateStr).toLocaleDateString(undefined, { weekday: 'short' }),
      icon: iconFor(daily.weather_code[i], 1),
      low: Math.round(daily.temperature_2m_min[i]),
      high: Math.round(daily.temperature_2m_max[i])
    }));

    const weekMin = Math.min(...days.map(d => d.low));
    const weekMax = Math.max(...days.map(d => d.high));
    const weekSpan = weekMax - weekMin || 1;

    const daysEl = document.getElementById('days');
    daysEl.innerHTML = '';
    days.forEach(d => {
      const startPct = ((d.low - weekMin) / weekSpan) * 100;
      const widthPct = ((d.high - d.low) / weekSpan) * 100;

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <span class="name">${d.name}</span>
        <span class="icon">${d.icon}</span>
        <span class="range-bar">
          <span class="lo">${d.low}\u00b0</span>
          <span class="track">
            <span class="fill" style="left:${startPct}%; width:${widthPct}%;"></span>
          </span>
          <span class="hi">${d.high}\u00b0</span>
        </span>
      `;
      daysEl.appendChild(row);
    });
  }
</script>

</body>
</html>
