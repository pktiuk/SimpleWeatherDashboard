<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather dashboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --border: #e2e4e8;
    --track: #eceef1;
    --text-primary: #16181d;
    --text-secondary: #6b7280;
    --text-muted: #9aa0aa;
    --accent: #2a78d6;
    --card-border-width: 1px;
  }

  /* Monochromatic theme: pure black/white/gray for e-ink screens.
     Activated with ?theme=monochromatic (default is "regular"). */
  body.theme-monochromatic {
    --bg: #ffffff;
    --card: #ffffff;
    --border: #000000;
    --track: #d8d8d8;
    --text-primary: #000000;
    --text-secondary: #333333;
    --text-muted: #555555;
    --accent: #000000;
    --card-border-width: 2px;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; overflow-x: hidden; }
  body {
    margin: 0;
    padding: 40px 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text-primary);
    font-size: 18px; /* base bump so 'em'-ish sizing everywhere feels bigger */
  }
  .dashboard {
    max-width: 1160px;
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "header days"
      "graph  days";
    gap: 20px;
  }
  .card {
    background: var(--card);
    border: var(--card-border-width) solid var(--border);
    border-radius: 18px;
    padding: 28px 0;
  }
  body.theme-monochromatic { font-weight: 500; }
  body.theme-monochromatic .track { border: 1px solid #000; background: #fff; }
  body.theme-monochromatic .fill { background: #000; }
  .icon svg { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; }
  .header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .header .icon { font-size: 64px; line-height: 1; flex-shrink: 0; }
  .header .place-info { flex: 1; min-width: 0; }
  .header h1 { margin: 0; font-size: 28px; font-weight: 600; }
  .header .sub { margin: 6px 0 0; font-size: 18px; color: var(--text-secondary); }
  .header .time { font-size: 18px; color: var(--text-secondary); }
  .header .temp-block { text-align: right; flex-shrink: 0; }
  .header .temp { font-size: 52px; font-weight: 600; line-height: 1; }
  .header .cond { font-size: 18px; color: var(--text-secondary); margin-top: 6px; }

  .graph { grid-area: graph; }
  .graph h3 { margin: 0 0 16px; font-size: 20px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
  .graph-wrap { position: relative; width: 100%; height: 320px; }

  .days {
    grid-area: days;
    display: flex;
    flex-direction: column;
    gap: 18px;
    justify-content: space-between;
  }
  .day-row {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 16px 20px;
  }
  .day-row .name { font-size: 20px; font-weight: 600; width: 60px; flex-shrink: 0; }
  .day-row .icon { font-size: 32px; width: 42px; text-align: center; flex-shrink: 0; }

  /* range bar widget: ( ||||| ) style, scaled to the shared week min/max */
  .range-bar {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }
  .range-bar .lo, .range-bar .hi {
    font-size: 18px;
    color: var(--text-secondary);
    width: 46px;
    flex-shrink: 0;
  }
  .range-bar .lo { text-align: right; }
  .range-bar .track {
    position: relative;
    flex: 1;
    height: 22px;
    background: var(--track);
    border-radius: 6px;
    overflow: hidden;
  }
  .range-bar .fill {
    position: absolute;
    top: 3px;
    bottom: 3px;
    background: var(--accent);
    border-radius: 4px;
  }

  @media (max-width: 900px) {
    .dashboard {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas:
        "header"
        "graph"
        "days";
    }
  }

  @media (max-width: 600px) {
    body { padding: 20px 14px; font-size: 17px; }
    .card { padding: 22px 20px; border-radius: 16px; }
    .header { gap: 16px; }
    .header .icon { font-size: 48px; }
    .header h1 { font-size: 24px; }
    .header .temp { font-size: 42px; }
    .graph-wrap { height: 240px; }
    .day-row .icon { font-size: 28px; }
  }
</style>
</head>
<body>

<div class="dashboard">

  <div class="card header">
    <div class="icon">&hellip;</div>
    <div class="place-info">
      <h1>Loading&hellip;</h1>
      <p class="sub"><span class="time"></span></p>
    </div>
    <div class="temp-block">
      <div class="temp">&ndash;&deg;C</div>
      <div class="cond"></div>
    </div>
  </div>

  <div class="card graph">
    <h3>Next 24 hours</h3>
    <div class="graph-wrap">
      <canvas id="tempChart" role="img" aria-label="Chart of temperature and chance of rain for the next 24 hours, updated live from Open-Meteo">Loading live temperature and rain-chance data for the next 24 hours.</canvas>
    </div>
  </div>

  <div class="card days" id="days">
    <!-- rows injected by script, built from each day's low/high scaled to the shared week min/max -->
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
  // --- location: defaults, overridable via URL params ---
  // Examples:
  //   ?lat=48.8566&lon=2.3522&name=Paris,%20France
  //   ?city=Tokyo
  const DEFAULT_LAT = 52.2297;
  const DEFAULT_LON = 21.0122;
  const DEFAULT_LOCATION_NAME = 'Warsaw, Poland';

  const urlParams = new URLSearchParams(window.location.search);

  // --- theme: "regular" (default) or "monochromatic" (?theme=monochromatic), for e-ink screens ---
  const THEME = urlParams.get('theme') === 'monochromatic' ? 'monochromatic' : 'regular';
  if (THEME === 'monochromatic') {
    document.body.classList.add('theme-monochromatic');
  }

  // WMO weather codes -> [emoji, text]. https://open-meteo.com/en/docs
  const WEATHER_CODES = {
    0: ['\u2600\ufe0f', 'Clear'], 1: ['\ud83c\udf24\ufe0f', 'Mostly clear'],
    2: ['\u26c5', 'Partly cloudy'], 3: ['\u2601\ufe0f', 'Overcast'],
    45: ['\ud83c\udf2b\ufe0f', 'Fog'], 48: ['\ud83c\udf2b\ufe0f', 'Fog'],
    51: ['\ud83c\udf27\ufe0f', 'Light drizzle'], 53: ['\ud83c\udf27\ufe0f', 'Drizzle'], 55: ['\ud83c\udf27\ufe0f', 'Dense drizzle'],
    61: ['\ud83c\udf27\ufe0f', 'Light rain'], 63: ['\ud83c\udf27\ufe0f', 'Rain'], 65: ['\ud83c\udf27\ufe0f', 'Heavy rain'],
    71: ['\ud83c\udf28\ufe0f', 'Light snow'], 73: ['\ud83c\udf28\ufe0f', 'Snow'], 75: ['\ud83c\udf28\ufe0f', 'Heavy snow'],
    80: ['\ud83c\udf26\ufe0f', 'Showers'], 81: ['\ud83c\udf26\ufe0f', 'Showers'], 82: ['\u26c8\ufe0f', 'Violent showers'],
    95: ['\u26c8\ufe0f', 'Thunderstorm'], 96: ['\u26c8\ufe0f', 'Thunderstorm'], 99: ['\u26c8\ufe0f', 'Thunderstorm']
  };
  const NIGHT_CLEAR_ICON = '\ud83c\udf19';

  function iconFor(code, isDay) {
    const entry = WEATHER_CODES[code] || ['\u2601\ufe0f', ''];
    if ((code === 0 || code === 1) && isDay === 0) return NIGHT_CLEAR_ICON;
    return entry[0];
  }
  function textFor(code) {
    return (WEATHER_CODES[code] || ['', 'Unknown'])[1];
  }

  // WMO weather code -> [dayIconKey, nightIconKey], for the monochrome SVG icon set below.
  const MONO_ICON_KEYS = {
    0: ['sun', 'moon'], 1: ['cloud-sun', 'cloud-moon'],
    2: ['cloud-sun', 'cloud-moon'], 3: ['cloud', 'cloud'],
    45: ['fog', 'fog'], 48: ['fog', 'fog'],
    51: ['drizzle', 'drizzle'], 53: ['drizzle', 'drizzle'], 55: ['drizzle', 'drizzle'],
    61: ['rain', 'rain'], 63: ['rain', 'rain'], 65: ['rain', 'rain'],
    71: ['snow', 'snow'], 73: ['snow', 'snow'], 75: ['snow', 'snow'],
    80: ['rain', 'rain'], 81: ['rain', 'rain'], 82: ['storm', 'storm'],
    95: ['storm', 'storm'], 96: ['storm', 'storm'], 99: ['storm', 'storm']
  };

  // Solid black-line/black-fill vector icons — legible on e-ink, unlike a grayscale
  // filter over color emoji (which washes pale colors like cloud-white into nothing).
  const MONO_SVG = {
    'sun': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><line x1="12" y1="1.2" x2="12" y2="3.8"/><line x1="12" y1="20.2" x2="12" y2="22.8"/><line x1="1.2" y1="12" x2="3.8" y2="12"/><line x1="20.2" y1="12" x2="22.8" y2="12"/><line x1="4.4" y1="4.4" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.2" y2="17.8"/><line x1="17.8" y1="6.2" x2="19.6" y2="4.4"/></svg>',
    'moon': '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M15.8 3.3a8.6 8.6 0 1 0 5 15.4 9.4 9.4 0 0 1-5-15.4z"/></svg>',
    'cloud': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M6.5 18h10.2a3.8 3.8 0 0 0 .4-7.6A5.3 5.3 0 0 0 6.9 9.3 3.8 3.8 0 0 0 6.5 18z"/></svg>',
    'cloud-sun': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="16.3" cy="7.3" r="2.9"/><line x1="16.3" y1="1.8" x2="16.3" y2="3.2"/><line x1="21.3" y1="7.3" x2="19.9" y2="7.3"/><line x1="19.7" y1="3.9" x2="18.7" y2="4.9"/><path d="M5.7 18h9.4a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.5 1.1A3.5 3.5 0 0 0 5.7 18z"/></svg>',
    'cloud-moon': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path fill="currentColor" stroke="none" d="M19.2 2.6a5.3 5.3 0 1 0 2.9 9.4 5.8 5.8 0 0 1-2.9-9.4z"/><path d="M5.7 18h9.4a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.5 1.1A3.5 3.5 0 0 0 5.7 18z"/></svg>',
    'fog': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 10.2h10.2a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4 1.1 3.4 3.4 0 0 0-1.1 5.7z"/><line x1="3" y1="14.2" x2="21" y2="14.2"/><line x1="3" y1="17.6" x2="21" y2="17.6"/><line x1="3" y1="21" x2="21" y2="21"/></svg>',
    'drizzle': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.3 13h9.9a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4 1.1A3.4 3.4 0 0 0 6.3 13z"/><line x1="8.3" y1="17" x2="7.5" y2="19.2"/><line x1="12.3" y1="17" x2="11.5" y2="19.2"/><line x1="16.3" y1="17" x2="15.5" y2="19.2"/></svg>',
    'rain': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6.3 12.5h9.9a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4 1.1 3.4 3.4 0 0 0-.8 5.7z"/><line x1="7.8" y1="16.5" x2="6.6" y2="21.5"/><line x1="12" y1="16.5" x2="10.8" y2="21.5"/><line x1="16.2" y1="16.5" x2="15" y2="21.5"/></svg>',
    'snow': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6.3 12.5h9.9a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4 1.1 3.4 3.4 0 0 0-.8 5.7z"/><line x1="8" y1="16.6" x2="8" y2="21.4"/><line x1="6.2" y1="17.9" x2="9.8" y2="20.1"/><line x1="9.8" y1="17.9" x2="6.2" y2="20.1"/><line x1="16" y1="16.6" x2="16" y2="21.4"/><line x1="14.2" y1="17.9" x2="17.8" y2="20.1"/><line x1="17.8" y1="17.9" x2="14.2" y2="20.1"/></svg>',
    'storm': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 12h9.9a3.4 3.4 0 0 0 .3-6.8 4.9 4.9 0 0 0-9.4 1.1A3.4 3.4 0 0 0 6.3 12z"/><path fill="currentColor" stroke="none" d="M13.2 12.6l-3.4 5.6h3l-1.7 5 5-6.7h-3.2z"/></svg>'
  };

  function iconMarkup(code, isDay, isMono) {
    if (isMono) {
      const keys = MONO_ICON_KEYS[code] || ['cloud', 'cloud'];
      const key = isDay === 0 ? keys[1] : keys[0];
      return MONO_SVG[key] || MONO_SVG['cloud'];
    }
    return iconFor(code, isDay);
  }

  // Resolve the location to use, then kick off the forecast fetch.
  resolveLocation()
    .then(loadForecast)
    .then(renderDashboard)
    .catch(err => {
      console.error(err);
      document.querySelector('.dashboard').insertAdjacentHTML(
        'afterbegin',
        '<p style="grid-column: 1 / -1; color: var(--text-secondary); font-size: 16px;">Couldn\u2019t load live weather data. Check your connection, or the ?city= / ?lat=&lon= value in the URL, and reload.</p>'
      );
    });

  // Returns { lat, lon, name }, from URL params if present, else the defaults.
  function resolveLocation() {
    const latParam = urlParams.get('lat');
    const lonParam = urlParams.get('lon');
    const nameParam = urlParams.get('name');
    const cityParam = urlParams.get('city');

    if (latParam && lonParam) {
      return Promise.resolve({
        lat: parseFloat(latParam),
        lon: parseFloat(lonParam),
        name: nameParam || `${latParam}, ${lonParam}`
      });
    }

    if (cityParam) {
      const geoParams = new URLSearchParams({ name: cityParam, count: '1', language: 'en', format: 'json' });
      return fetch(`https://geocoding-api.open-meteo.com/v1/search?${geoParams}`)
        .then(res => res.json())
        .then(geo => {
          const hit = geo.results && geo.results[0];
          if (!hit) throw new Error(`No location found for "${cityParam}"`);
          const label = [hit.name, hit.admin1, hit.country].filter(Boolean).join(', ');
          return { lat: hit.latitude, lon: hit.longitude, name: label };
        });
    }

    return Promise.resolve({ lat: DEFAULT_LAT, lon: DEFAULT_LON, name: DEFAULT_LOCATION_NAME });
  }

  function loadForecast(location) {
    const params = new URLSearchParams({
      latitude: location.lat,
      longitude: location.lon,
      current: 'temperature_2m,weather_code,is_day',
      hourly: 'temperature_2m,precipitation_probability',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min',
      timezone: 'auto',
      forecast_days: '6'
    });

    return fetch(`https://api.open-meteo.com/v1/forecast?${params}`)
      .then(res => {
        if (!res.ok) throw new Error('Open-Meteo request failed: ' + res.status);
        return res.json();
      })
      .then(data => {
        data._locationName = location.name;
        return data;
      });
  }

  function renderDashboard(data) {
    renderHeader(data);
    renderHourlyChart(data);
    renderDays(data);
  }

  function renderHeader(data) {
    const cur = data.current;
    document.querySelector('.header .icon').innerHTML = iconMarkup(cur.weather_code, cur.is_day, THEME === 'monochromatic');
    document.querySelector('.header h1').textContent = data._locationName;
    document.querySelector('.temp-block .temp').textContent = Math.round(cur.temperature_2m) + '\u00b0C';
    document.querySelector('.temp-block .cond').textContent = textFor(cur.weather_code);

    const now = new Date(cur.time);
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
    const timeStr = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    document.querySelector('.header .sub').innerHTML = `${dateStr} &middot; <span class="time">${timeStr}</span>`;
  }

  function renderHourlyChart(data) {
    const times = data.hourly.time;
    const temps = data.hourly.temperature_2m;
    const rain = data.hourly.precipitation_probability;

    // find the index matching the current hour, then take the next 24 hours from there
    const nowMs = new Date(data.current.time).getTime();
    let startIdx = times.findIndex(t => new Date(t).getTime() >= nowMs);
    if (startIdx === -1) startIdx = 0;

    const hourLabels = [];
    const hourTemps = [];
    const hourRain = [];
    for (let i = startIdx; i < startIdx + 24 && i < times.length; i += 3) {
      const d = new Date(times[i]);
      hourLabels.push(i === startIdx ? 'Now' : d.toLocaleTimeString(undefined, { hour: 'numeric' }));
      hourTemps.push(Math.round(temps[i]));
      hourRain.push(Math.round(rain[i]));
    }

    const isMono = THEME === 'monochromatic';
    const rainColor = isMono ? '#bbbbbb' : '#a9c7ea';
    const lineColor = isMono ? '#000000' : '#e0a800';
    const lineFill = isMono ? 'rgba(0, 0, 0, 0.08)' : 'rgba(224, 168, 0, 0.12)';
    const gridColor = isMono ? '#cccccc' : '#eceef1';
    const tickColor = isMono ? '#000000' : undefined;

    new Chart(document.getElementById('tempChart'), {
      data: {
        labels: hourLabels,
        datasets: [
          {
            type: 'bar',
            label: 'Chance of rain (%)',
            data: hourRain,
            backgroundColor: rainColor,
            borderColor: isMono ? '#000000' : rainColor,
            borderWidth: isMono ? 1 : 0,
            borderRadius: 3,
            yAxisID: 'y1',
            order: 2
          },
          {
            type: 'line',
            label: 'Temperature (\u00b0C)',
            data: hourTemps,
            borderColor: lineColor,
            backgroundColor: lineFill,
            borderWidth: 3,
            pointRadius: 5,
            pointBackgroundColor: lineColor,
            pointBorderColor: '#ffffff',
            pointBorderWidth: 2,
            fill: true,
            tension: 0.35,
            yAxisID: 'y',
            order: 1
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: {
            position: 'left',
            ticks: { callback: (v) => v + '\u00b0', font: { size: 15 }, color: tickColor },
            grid: { color: gridColor }
          },
          y1: {
            position: 'right',
            min: 0,
            max: 100,
            ticks: { callback: (v) => v + '%', font: { size: 15 }, color: tickColor },
            grid: { display: false }
          },
          x: {
            grid: { display: false },
            ticks: { font: { size: 15 }, color: tickColor }
          }
        }
      }
    });
  }

  function renderDays(data) {
    const daily = data.daily;
    const days = daily.time.slice(0, 5).map((dateStr, i) => ({
      name: new Date(dateStr).toLocaleDateString(undefined, { weekday: 'short' }),
      icon: iconMarkup(daily.weather_code[i], 1, THEME === 'monochromatic'),
      low: Math.round(daily.temperature_2m_min[i]),
      high: Math.round(daily.temperature_2m_max[i])
    }));

    const weekMin = Math.min(...days.map(d => d.low));
    const weekMax = Math.max(...days.map(d => d.high));
    const weekSpan = weekMax - weekMin || 1;

    const daysEl = document.getElementById('days');
    daysEl.innerHTML = '';
    days.forEach(d => {
      const startPct = ((d.low - weekMin) / weekSpan) * 100;
      const widthPct = ((d.high - d.low) / weekSpan) * 100;

      const row = document.createElement('div');
      row.className = 'day-row';
      row.innerHTML = `
        <span class="name">${d.name}</span>
        <span class="icon">${d.icon}</span>
        <span class="range-bar">
          <span class="lo">${d.low}\u00b0</span>
          <span class="track">
            <span class="fill" style="left:${startPct}%; width:${widthPct}%;"></span>
          </span>
          <span class="hi">${d.high}\u00b0</span>
        </span>
      `;
      daysEl.appendChild(row);
    });
  }
</script>

</body>
</html>
